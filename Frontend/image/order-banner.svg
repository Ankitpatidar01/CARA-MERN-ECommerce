<svg xmlns="http://www.w3.org/2000/svg" width="420" height="280" viewBox="0 0 420 280">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B7CFF"></stop>
      <stop offset="100%" stop-color="#5B50F5"></stop>
    </linearGradient>

    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"></stop>
      <stop offset="100%" stop-color="#F8F8FF"></stop>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity="0.15"></feDropShadow>
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="320" cy="140" r="95" fill="#EEE9FF"></circle>

  <!-- Shopping Bag -->
  <g filter="url(#shadow)">
    <rect x="170" y="65" width="120" height="140" rx="16" fill="url(#bg)"></rect>

    <path d="M205 80
             C205 55 255 55 255 80" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"></path>

    <text x="230" y="145" font-size="46" text-anchor="middle" fill="white" font-family="Arial" font-weight="bold">
      C
    </text>
  </g>

  <!-- Floating Order Card -->
  <g filter="url(#shadow)">
    <rect x="55" y="105" width="125" height="90" rx="12" fill="url(#card)"></rect>

    <circle cx="78" cy="130" r="8" fill="#6C63FF"></circle>

    <rect x="95" y="124" width="60" height="6" rx="3" fill="#D7D7F7"></rect>
    <rect x="95" y="138" width="45" height="6" rx="3" fill="#E7E7FA"></rect>

    <rect x="70" y="162" width="70" height="16" rx="8" fill="#DFF8E7"></rect>
    <text x="105" y="174" text-anchor="middle" font-size="9" font-family="Arial" fill="#22A55B" font-weight="bold">
      DELIVERED
    </text>
  </g>

  <!-- Decorative Dots -->
  <circle cx="120" cy="55" r="5" fill="#A89CFF"></circle>
  <circle cx="330" cy="40" r="4" fill="#C7BEFF"></circle>
  <circle cx="360" cy="220" r="6" fill="#B3A7FF"></circle>
  <circle cx="300" cy="240" r="3" fill="#D5CEFF"></circle>

  <!-- Small Stars -->
  <path d="M70 55 L73 62 L80 63 L74 67 L76 74 L70 70 L64 74 L66 67 L60 63 L67 62Z" fill="#FFD54A"></path>

  <path d="M345 85 L347 90 L352 91 L348 94 L349 99 L345 96 L341 99 L342 94 L338 91 L343 90Z" fill="#FFD54A"></path>
</svg>